[package]
name = "levelo-windows"
version = "0.0.1"
edition = "2024"

[lib]
name = "levelo_windows"
path = "src/lib.rs"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
] }
skia-safe = { version = "0.153.3", features = ["textlayout"] }
taffy = "0.15.1"
rquickjs = { version = "0.14.0", features = ["macro"] }
levelo-core = { path = "../../native/levelo-core" }